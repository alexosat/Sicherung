# nginx-Reverse-Proxy für die Anmelde-App.
# Ziel-Pfad auf dem Server: /etc/nginx/sites-available/anmeldung
# Aktivieren:
#   sudo ln -s /etc/nginx/sites-available/anmeldung /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS wird anschließend automatisch von certbot ergänzt (siehe Anleitung).

server {
    listen 80;
    listen [::]:80;
    server_name anmeldung.obs-doerverden.de;

    # Uploads/Formulargröße begrenzen (kein Datei-Upload nötig)
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statische Dateien direkt von nginx ausliefern (schneller).
    location /static/ {
        alias /home/anmeldung/Sicherung/static/;
        expires 7d;
    }
}
