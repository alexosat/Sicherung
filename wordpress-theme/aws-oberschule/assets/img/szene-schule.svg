<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration: Schulgebaeude am Zusammenfluss von Aller und Weser">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEEF6"/>
      <stop offset="1" stop-color="#EAF5F8"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FD0DE"/>
      <stop offset="1" stop-color="#0F5FA8"/>
    </linearGradient>
    <linearGradient id="build" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEF3"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3CE"/>
      <stop offset="1" stop-color="#4FB3A8"/>
    </linearGradient>
  </defs>

  <!-- Himmel -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Sonne -->
  <circle cx="650" cy="120" r="52" fill="#FFD37A"/>
  <circle cx="650" cy="120" r="52" fill="#FFE6AE" opacity=".45"/>
  <!-- Wolken -->
  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="180" cy="110" rx="58" ry="24"/>
    <ellipse cx="230" cy="120" rx="46" ry="20"/>
    <ellipse cx="470" cy="80" rx="44" ry="18"/>
    <ellipse cx="510" cy="88" rx="34" ry="15"/>
  </g>

  <!-- Ferne Huegel -->
  <path d="M0 330 Q 200 280 400 320 T 800 315 V600 H0 Z" fill="#BEE3DE"/>
  <path d="M0 370 Q 250 320 520 360 T 800 360 V600 H0 Z" fill="url(#hill)"/>

  <!-- Baeume links -->
  <g>
    <rect x="92" y="330" width="10" height="40" rx="4" fill="#6B4A2B"/>
    <circle cx="97" cy="322" r="30" fill="#57B79F"/>
    <circle cx="78" cy="335" r="22" fill="#68C6AC"/>
    <circle cx="118" cy="335" r="22" fill="#4EA98F"/>
  </g>

  <!-- Schulgebaeude -->
  <g>
    <!-- Hauptbau -->
    <rect x="250" y="238" width="300" height="150" rx="8" fill="url(#build)" stroke="#CBDCE6" stroke-width="2"/>
    <!-- Dachband -->
    <rect x="250" y="238" width="300" height="18" rx="8" fill="#0B4680"/>
    <!-- Fensterreihen -->
    <g fill="#3FD0DE">
      <rect x="272" y="272" width="34" height="30" rx="4"/>
      <rect x="318" y="272" width="34" height="30" rx="4"/>
      <rect x="364" y="272" width="34" height="30" rx="4"/>
      <rect x="448" y="272" width="34" height="30" rx="4"/>
      <rect x="494" y="272" width="34" height="30" rx="4"/>
      <rect x="272" y="316" width="34" height="30" rx="4"/>
      <rect x="318" y="316" width="34" height="30" rx="4"/>
      <rect x="448" y="316" width="34" height="30" rx="4"/>
      <rect x="494" y="316" width="34" height="30" rx="4"/>
    </g>
    <!-- Eingang -->
    <rect x="378" y="316" width="44" height="72" rx="4" fill="#0F5FA8"/>
    <rect x="386" y="326" width="28" height="62" rx="3" fill="#123043"/>
    <line x1="400" y1="326" x2="400" y2="388" stroke="#3FD0DE" stroke-width="2"/>
    <!-- Treppe -->
    <rect x="366" y="388" width="68" height="7" rx="3" fill="#CBDCE6"/>
    <rect x="358" y="395" width="84" height="7" rx="3" fill="#B9CEDA"/>
    <!-- Turm mit Fahne -->
    <rect x="300" y="186" width="40" height="54" rx="6" fill="url(#build)" stroke="#CBDCE6" stroke-width="2"/>
    <rect x="300" y="186" width="40" height="12" rx="6" fill="#0B4680"/>
    <rect x="316" y="206" width="8" height="30" rx="3" fill="#3FD0DE"/>
    <line x1="320" y1="150" x2="320" y2="188" stroke="#5A6B73" stroke-width="3"/>
    <path d="M320 154 L356 162 L320 172 Z" fill="#10B3C2"/>
  </g>

  <!-- Zusammenfluss zweier Fluesse -->
  <path d="M-20 402 C 180 420, 300 470, 400 512 C 300 470, 150 470, -20 470 Z" fill="url(#river)" opacity=".9"/>
  <path d="M820 408 C 620 428, 500 472, 400 512 C 520 472, 660 474, 820 476 Z" fill="url(#river)" opacity=".9"/>
  <path d="M340 508 C 380 540, 420 560, 400 600 L 800 600 L 800 500 C 640 505, 500 505, 340 508 Z" fill="url(#river)"/>
  <path d="M340 508 C 380 540, 420 560, 400 600 L 0 600 L 0 496 C 150 500, 260 505, 340 508 Z" fill="url(#river)"/>
  <!-- Glanzlichter auf dem Wasser -->
  <g stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120 500 q 40 -10 80 0"/>
    <path d="M560 500 q 40 -10 80 0"/>
    <path d="M330 552 q 40 -8 80 2"/>
  </g>
</svg>
